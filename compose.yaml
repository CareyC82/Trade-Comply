services:
  consumer:
    build: .
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - consumer-data:/var/lib/tracewize-consumer
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  consumer-data:
